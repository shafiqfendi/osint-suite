<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT Recon Suite</title>
<style>
  :root {
    --bg: #090d16; --card: #111827; --card2: #0d1322; --border: #1e293b;
    --accent: #00e5ff; --accent-dim: rgba(0, 229, 255, 0.12);
    --text: #e2e8f0; --muted: #94a3b8; --ok: #10b981; --warn: #f59e0b; --bad: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 24px 16px; line-height: 1.5; }
  .wrap { max-width: 1060px; margin: 0 auto; }

  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .brand { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }
  .pill { font-size: 0.72rem; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,229,255,0.3); padding: 3px 10px; border-radius: 99px; margin-left: 8px; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tab { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 9px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.88rem; transition: 0.2s; }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  .panel { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
  .panel.active { display: block; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  input[type="text"], input[type="file"] { flex: 1; min-width: 220px; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 8px; font-size: 0.94rem; outline: none; }
  input:focus { border-color: var(--accent); }
  .btn { background: var(--accent); color: #05101a; border: none; padding: 11px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
  .btn:hover { opacity: 0.9; }
  .btn-sec { background: var(--card2); color: var(--accent); border: 1px solid rgba(0,229,255,0.35); padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.82rem; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin-top: 14px; }
  .box { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .box h4 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--accent); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .kv { font-size: 0.86rem; margin-bottom: 5px; word-break: break-word; }
  .kv b { color: var(--muted); font-weight: 600; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; }
  .tag { background: #0f172a; border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px; font-family: monospace; font-size: 0.78rem; color: #bae6fd; }

  .grid-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 10px; margin-top: 12px; }
  .item-card { display: flex; justify-content: space-between; align-items: center; background: var(--card2); border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--text); font-size: 0.86rem; }
  .item-card:hover { border-color: var(--accent); }
  .badge-ok { color: var(--ok); font-weight: 700; font-size: 0.76rem; }
  .badge-warn { color: var(--warn); font-size: 0.76rem; }
  .badge-no { color: var(--muted); font-size: 0.76rem; }

  .dork-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--card2); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .dork-q { font-family: monospace; font-size: 0.83rem; color: #fde047; word-break: break-all; }
  .loader { color: var(--accent); font-size: 0.9rem; margin: 10px 0; }
  .err { color: var(--bad); font-size: 0.9rem; margin: 10px 0; }
  footer { text-align: center; margin-top: 26px; font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><span class="brand">OSINT RECON SUITE</span><span class="pill">FULL-STACK PYTHON</span></div>
    <button class="btn-sec" onclick="exportLastJSON()">Muat Turun Laporan (.JSON)</button>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="openTab('domain', this)">Domain Recon</button>
    <button class="tab" onclick="openTab('ip', this)">IP & Port Scan</button>
    <button class="tab" onclick="openTab('username', this)">Username Scanner</button>
    <button class="tab" onclick="openTab('email', this)">Email Intel</button>
    <button class="tab" onclick="openTab('exif', this)">EXIF & GPS Gambar</button>
    <button class="tab" onclick="openTab('dorks', this)">Google Dorks</button>
  </div>

  <!-- 1. DOMAIN -->
  <div id="tab-domain" class="panel active">
    <div class="row">
      <input type="text" id="domainIn" placeholder="Masukkan domain (cth: example.com)">
      <button class="btn" onclick="scanDomain()">Imbas Domain</button>
    </div>
    <div id="domainOut"></div>
  </div>

  <!-- 2. IP & PORTS -->
  <div id="tab-ip" class="panel">
    <div class="row">
      <input type="text" id="ipIn" placeholder="Masukkan IP atau domain (cth: 1.1.1.1 atau scanme.nmap.org)">
      <button class="btn" onclick="scanIP()">Analisis IP & Port</button>
    </div>
    <div id="ipOut"></div>
  </div>

  <!-- 3. USERNAME -->
  <div id="tab-username" class="panel">
    <div class="row">
      <input type="text" id="userIn" placeholder="Masukkan username (cth: torvalds)">
      <button class="btn" onclick="scanUser()">Imbas Platform</button>
    </div>
    <div id="userOut"></div>
  </div>

  <!-- 4. EMAIL -->
  <div id="tab-email" class="panel">
    <div class="row">
      <input type="text" id="emailIn" placeholder="Masukkan alamat emel (cth: nama@domain.com)">
      <button class="btn" onclick="scanEmail()">Semak Emel</button>
    </div>
    <div id="emailOut"></div>
  </div>

  <!-- 5. EXIF -->
  <div id="tab-exif" class="panel">
    <div class="row">
      <input type="file" id="exifIn" accept="image/*">
      <button class="btn" onclick="scanExif()">Ekstrak Metadata</button>
    </div>
    <div id="exifOut"></div>
  </div>

  <!-- 6. GOOGLE DORKS -->
  <div id="tab-dorks" class="panel">
    <div class="row">
      <input type="text" id="dorkIn" placeholder="Masukkan domain sasaran (cth: example.com)">
      <button class="btn" onclick="genDorks()">Jana Dorks</button>
    </div>
    <div id="dorkOut"></div>
  </div>

  <footer>Gunakan untuk tujuan pendidikan, penyelidikan keselamatan, dan OSINT yang sah sahaja.</footer>
</div>

<script>
let lastReport = null;

function openTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

function exportLastJSON() {
  if (!lastReport) return alert('Tiada data imbasan untuk dimuat turun lagi.');
  const blob = new Blob([JSON.stringify(lastReport, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `osint-report-${Date.now()}.json`;
  a.click();
}

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Ralat pelayan');
  lastReport = data;
  return data;
}

// 1. DOMAIN
async function scanDomain() {
  const target = document.getElementById('domainIn').value.trim();
  const out = document.getElementById('domainOut');
  if (!target) return;
  out.innerHTML = '<div class="loader">Sedang menarik WHOIS, DNS, SSL, HTTP Headers & Subdomain (crt.sh)...</div>';
  try {
    const d = await postJSON('/api/domain', { target });
    const w = d.whois, s = d.ssl, h = d.http_headers;
    out.innerHTML = `
      <div class="cards">
        <div class="box">
          <h4>Maklumat WHOIS</h4>
          ${w.error ? `<div class="err">${w.error}</div>` : `
            <div class="kv"><b>IP Utama:</b> ${d.ip}</div>
            <div class="kv"><b>Registrar:</b> ${w.registrar || '-'}</div>
            <div class="kv"><b>Organisasi:</b> ${w.org}</div>
            <div class="kv"><b>Negara:</b> ${w.country}</div>
            <div class="kv"><b>Dicipta:</b> ${w.creation_date}</div>
            <div class="kv"><b>Tamat Tempoh:</b> ${w.expiration_date}</div>
          `}
        </div>
        <div class="box">
          <h4>Sijil SSL/TLS</h4>
          ${s.error ? `<div class="err">${s.error}</div>` : `
            <div class="kv"><b>Common Name:</b> ${s.common_name}</div>
            <div class="kv"><b>Pengeluar:</b> ${s.issuer}</div>
            <div class="kv"><b>Sah Dari:</b> ${s.valid_from}</div>
            <div class="kv"><b>Sah Hingga:</b> ${s.valid_until}</div>
            <div class="kv"><b>Jumlah SAN:</b> ${s.san_count}</div>
          `}
        </div>
        <div class="box">
          <h4>HTTP & Keselamatan</h4>
          ${h.error ? `<div class="err">${h.error}</div>` : `
            <div class="kv"><b>Status:</b> ${h.status_code}</div>
            <div class="kv"><b>Server:</b> ${h.server}</div>
            <div class="kv"><b>Powered-By:</b> ${h.powered_by}</div>
            <div class="kv"><b>HSTS:</b> ${h.hsts} | <b>CSP:</b> ${h.csp}</div>
            <div class="kv"><b>X-Frame:</b> ${h.x_frame_options}</div>
          `}
        </div>
        <div class="box">
          <h4>Rekod DNS</h4>
          ${Object.entries(d.dns).map(([k, v]) => `<div class="kv"><b>${k}:</b> ${v.length ? v.join(', ') : '-'}</div>`).join('')}
        </div>
      </div>
      <div class="box" style="margin-top:14px;">
        <h4>Subdomain Ditemui via crt.sh (${d.subdomains.length})</h4>
        <div class="tag-list">${d.subdomains.length ? d.subdomains.map(sub => `<span class="tag">${sub}</span>`).join('') : '<span class="kv">Tiada subdomain ditemui.</span>'}</div>
      </div>`;
  } catch (e) { out.innerHTML = `<div class="err">${e.message}</div>`; }
}

// 2. IP & PORTS
async function scanIP() {
  const target = document.getElementById('ipIn').value.trim();
  const out = document.getElementById('ipOut');
  if (!target) return;
  out.innerHTML = '<div class="loader">Sedang memeriksa geolokasi, Reverse DNS & 13 port lazim...</div>';
  try {
    const d = await postJSON('/api/ip', { target });
    const g = d.geo || {};
    out.innerHTML = `
      <div class="cards">
        <div class="box">
          <h4>Geolokasi & Rangkaian</h4>
          <div class="kv"><b>IP:</b> ${d.ip}</div>
          <div class="kv"><b>Reverse DNS:</b> ${d.reverse_dns}</div>
          <div class="kv"><b>Negara:</b> ${g.country || '-'} (${g.country_code || '-'})</div>
          <div class="kv"><b>Lokasi:</b> ${g.city || '-'}, ${g.region || '-'}</div>
          <div class="kv"><b>ISP:</b> ${g.connection?.isp || '-'}</div>
          <div class="kv"><b>ASN:</b> AS${g.connection?.asn || '-'}</div>
          ${g.latitude ? `<div class="kv"><a href="https://www.google.com/maps?q=${g.latitude},${g.longitude}" target="_blank" style="color:var(--accent);">Lihat Lokasi di Google Maps ↗</a></div>` : ''}
        </div>
        <div class="box">
          <h4>Port Terbuka (${d.open_ports.length})</h4>
          ${d.open_ports.length ? d.open_ports.map(p => `<div class="kv"><span class="badge-ok">OPEN</span> Port <b>${p.port}</b> (${p.service})</div>`).join('') : '<div class="kv">Tiada port lazim terbuka atau disekat firewall.</div>'}
        </div>
      </div>`;
  } catch (e) { out.innerHTML = `<div class="err">${e.message}</div>`; }
}

// 3. USERNAME
async function scanUser() {
  const username = document.getElementById('userIn').value.trim();
  const out = document.getElementById('userOut');
  if (!username) return;
  out.innerHTML = '<div class="loader">Sedang mengimbas merentas platform secara serentak...</div>';
  try {
    const d = await postJSON('/api/username', { username });
    out.innerHTML = `<div class="grid-links">` + d.results.map(r => `
      <a class="item-card" href="${r.url}" target="_blank" rel="noopener">
        <span>${r.platform}</span>
        <span class="${r.found ? 'badge-ok' : (r.status.includes('Manual') ? 'badge-warn' : 'badge-no')}">${r.status}</span>
      </a>`).join('') + `</div>`;
  } catch (e) { out.innerHTML = `<div class="err">${e.message}</div>`; }
}

// 4. EMAIL
async function scanEmail() {
  const email = document.getElementById('emailIn').value.trim();
  const out = document.getElementById('emailOut');
  if (!email) return;
  out.innerHTML = '<div class="loader">Menyemak rekod MX, Gravatar & status domain...</div>';
  try {
    const d = await postJSON('/api/email', { email });
    const enc = encodeURIComponent(d.email);
    out.innerHTML = `
      <div class="cards">
        <div class="box">
          <h4>Analisis Emel</h4>
          <div class="kv"><b>Emel:</b> ${d.email}</div>
          <div class="kv"><b>Rekod MX Sah:</b> ${d.mx_valid ? '<span class="badge-ok">Ya (Boleh terima emel)</span>' : '<span class="err">Tiada</span>'}</div>
          <div class="kv"><b>Emel Pakai Buang:</b> ${d.is_disposable ? '<span class="err">Ya (Disposable)</span>' : 'Tidak'}</div>
          <div class="kv"><b>MD5 Hash:</b> <code>${d.md5_hash}</code></div>
          <div class="kv"><b>MX Servers:</b> ${d.mx_records.join(', ') || '-'}</div>
        </div>
        <div class="box">
          <h4>Gravatar & Pautan Siasatan</h4>
          ${d.gravatar_found ? `<img src="${d.gravatar_url}" style="width:72px;border-radius:50%;border:2px solid var(--accent);margin-bottom:10px;">` : '<div class="kv">Tiada profil Gravatar ditemui.</div>'}
          <div class="grid-links">
            <a class="item-card" href="https://haveibeenpwned.com/" target="_blank">Have I Been Pwned ↗</a>
            <a class="item-card" href="https://epieos.com/" target="_blank">Epieos ↗</a>
            <a class="item-card" href="https://www.google.com/search?q=%22${enc}%22" target="_blank">Google Exact Match ↗</a>
          </div>
        </div>
      </div>`;
  } catch (e) { out.innerHTML = `<div class="err">${e.message}</div>`; }
}

// 5. EXIF
async function scanExif() {
  const file = document.getElementById('exifIn').files[0];
  const out = document.getElementById('exifOut');
  if (!file) return alert('Sila pilih fail gambar terlebih dahulu.');
  out.innerHTML = '<div class="loader">Sedang mengekstrak metadata EXIF & GPS...</div>';
  const fd = new FormData();
  fd.append('image', file);
  try {
    const res = await fetch('/api/exif', { method: 'POST', body: fd });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error);
    lastReport = d;
    const metaEntries = Object.entries(d.metadata);
    out.innerHTML = `
      <div class="cards">
        <div class="box">
          <h4>Info Fail & GPS</h4>
          <div class="kv"><b>Nama Fail:</b> ${d.filename}</div>
          <div class="kv"><b>Format:</b> ${d.format} (${d.size})</div>
          ${d.gps ? `
            <div class="kv"><span class="badge-ok">GPS DITEMUI!</span></div>
            <div class="kv"><b>Koordinat:</b> ${d.gps.latitude}, ${d.gps.longitude}</div>
            <div class="kv"><a href="${d.gps.maps_url}" target="_blank" style="color:var(--accent);">Buka Lokasi di Google Maps ↗</a></div>
          ` : '<div class="kv">Tiada data koordinat GPS dalam gambar ini.</div>'}
        </div>
        <div class="box">
          <h4>Tag Metadata EXIF (${metaEntries.length})</h4>
          <div style="max-height:240px;overflow-y:auto;">
            ${metaEntries.length ? metaEntries.map(([k, v]) => `<div class="kv"><b>${k}:</b> ${v}</div>`).join('') : '<div class="kv">Tiada tag EXIF (kebiasaannya gambar daripada WhatsApp/Media Sosial telah dibersihkan metadatanya).</div>'}
          </div>
        </div>
      </div>`;
  } catch (e) { out.innerHTML = `<div class="err">${e.message}</div>`; }
}

// 6. GOOGLE DORKS
function genDorks() {
  const t = document.getElementById('dorkIn').value.trim().replace(/^https?:\/\//i, '').split('/')[0];
  if (!t) return;
  const list = [
    ['Dokumen Awam (PDF/DOCX/XLSX)', `site:${t} filetype:pdf OR filetype:docx OR filetype:xlsx`],
    ['Panel Admin / Login', `site:${t} inurl:admin OR inurl:login OR inurl:portal`],
    ['Open Directory (Index Of)', `site:${t} intitle:"index of"`],
    ['Fail Konfigurasi / Backup / SQL', `site:${t} ext:env OR ext:bak OR ext:sql OR ext:log OR ext:xml`],
    ['Subdomain Terindeks', `site:*.${t} -www`],
    ['Sebutan di Pastebin / GitHub', `(site:pastebin.com OR site:github.com) "${t}"`],
    ['Ralat Pangkalan Data', `site:${t} "SQL syntax" OR "Warning: mysql" OR "Fatal error"`]
  ];
  document.getElementById('dorkOut').innerHTML = list.map(([title, q]) => `
    <div class="dork-row">
      <div><div style="font-size:0.78rem;color:var(--muted);">${title}</div><div class="dork-q">${q}</div></div>
      <a class="btn-sec" style="text-decoration:none;" href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank">Cari ↗</a>
    </div>`).join('');
}
</script>
</body>
</html>
